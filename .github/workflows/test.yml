on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Build and Publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: [2.3, 2.4, 2.5, 2.6, 2.7, 3.1, 3.2, 3.3, 3.4]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set lockfile for Ruby version
        id: lockfile
        run: |
          if [[ "${{ matrix.ruby-version }}" =~ ^3\. ]]; then
            echo "LOCKFILE=Gemfile.lock.ruby3" >> $GITHUB_OUTPUT
            echo "BUNDLER_VERSION=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.ruby-version }}" =~ ^2\.[0-6] ]]; then
            echo "LOCKFILE=Gemfile.lock.ruby2" >> $GITHUB_OUTPUT
            echo "BUNDLER_VERSION=1.17.3" >> $GITHUB_OUTPUT
          else
            echo "LOCKFILE=Gemfile.lock" >> $GITHUB_OUTPUT
            echo "BUNDLER_VERSION=1.17.3" >> $GITHUB_OUTPUT
          fi

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: ${{ steps.lockfile.outputs.BUNDLER_VERSION }}
          bundler-cache: true
        env:
          BUNDLE_LOCKFILE: ${{ steps.lockfile.outputs.LOCKFILE }}

      - name: Test
        run: bundle exec rake
        env:
          BUNDLE_LOCKFILE: ${{ steps.lockfile.outputs.LOCKFILE }}

      - name: Sync README
        run: |
          bundle exec script/sync-readme-usage
          git diff --exit-code
        env:
          BUNDLE_LOCKFILE: ${{ steps.lockfile.outputs.LOCKFILE }}

  results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Final Results
    needs: [test]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}

  report-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Report version
        run: |
          curl -sS -X POST -u "$ENFORCER_USERNAME:$ENFORCER_PASSWORD" \
           -H "Content-Type: application/json" \
           -d '{"name":"aptible-cli", "type":"client", "version": "${{ github.sha }}"}' \
          "$ENFORCER_API/repo_version"
        env:
          ENFORCER_API: https://app-83237.aptible-test-leeroy.com
          ENFORCER_USERNAME: aptible
          ENFORCER_PASSWORD: ${{ secrets.ENFORCER_PASSWORD }}
